<section class="products-section">
  <div class="container">
    <p class="section-tag">Featured</p>
    <select [(ngModel)]="selectedBrand" (change)="filterProducts($event)" class="form-select mb-4 w-auto">
      <option value="All">All</option>
      <option value="Nike">Nike</option>
      <option value="Adidas">Adidas</option>
      <option value="New Balance">New Balance</option>
      <option value="Jordan">Jordan</option>
    </select>
    <div class="row g-4">
      @for (product of filteredProducts(); track $index) {
        <div class="col-6 col-lg-3">
          <div class="product-card">
            <img [src]="product.img" [attr.alt]="product.name" class="product-img" />
            <div class="product-info">
              <p class="product-brand">{{ product.brand }}</p>
              <p class="product-name">{{ product.name }}</p>
              <p class="product-price" [style.color]="product.price > 120 ? 'red' : 'green'">
                <span>$</span>{{ product.price }}
              </p>
              <span
                class="badge mb-2"
                [class]="{ 'bg-success': product.inStock, 'bg-danger': !product.inStock }"
              >
                {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
              </span>
              <button class="add-to-cart" (click)="showAlert(product.name)" [disabled]="!product.inStock">Add to Cart</button>
            </div>
          </div>
        </div>
      } @empty {
        <p class="text-white">No products available</p>
      }
    </div>
  </div>
</section>
